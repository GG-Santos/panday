<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Panday skill ecosystem architecture</title>
  <desc id="desc">A central Panday relay connects twelve specialized skill nodes across discovery, lifecycle, composition, and migration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171239"/></linearGradient>
    <linearGradient id="hub" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".16" stroke="#93c5fd" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".34" stroke-width="2">
    <path d="M600 210L120 90M600 210L260 55M600 210L425 48M600 210L775 48M600 210L940 55M600 210L1080 90M600 210L120 330M600 210L260 365M600 210L425 372M600 210L775 372M600 210L940 365M600 210L1080 330"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="600" cy="210" r="68" fill="#111827" stroke="url(#hub)" stroke-width="4"/>
    <path d="M600 160l14 35 36 15-36 15-14 35-14-35-36-15 36-15z" fill="url(#hub)"/>
    <text x="600" y="275" fill="#e0f2fe" font-family="Inter,Segoe UI,sans-serif" font-size="18" text-anchor="middle" font-weight="700">PANDAY</text>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="middle" font-weight="600">
    <g fill="#0f172a" stroke="#67e8f9" stroke-width="2"><circle cx="120" cy="90" r="35"/><circle cx="260" cy="55" r="35"/><circle cx="425" cy="48" r="35"/><circle cx="775" cy="48" r="35"/><circle cx="940" cy="55" r="35"/><circle cx="1080" cy="90" r="35"/><circle cx="120" cy="330" r="35"/><circle cx="260" cy="365" r="35"/><circle cx="425" cy="372" r="35"/><circle cx="775" cy="372" r="35"/><circle cx="940" cy="365" r="35"/><circle cx="1080" cy="330" r="35"/></g>
    <g fill="#cffafe"><text x="120" y="95">DISCOVER</text><text x="260" y="60">CREATE</text><text x="425" y="53">INSPECT</text><text x="775" y="53">EVALUATE</text><text x="940" y="60">FIX</text><text x="1080" y="95">INSTALL</text><text x="120" y="335">CARD</text><text x="260" y="370">AUGMENT</text><text x="425" y="377">SYNTHESIZE</text><text x="775" y="377">OPTIMIZE</text><text x="940" y="370">CONNECT</text><text x="1080" y="335">MIGRATE</text></g>
  </g>
</svg>
